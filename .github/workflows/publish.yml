name: Publish to NPM

# Manual only, on purpose.
#
# A `push: branches: [main]` trigger combined with changesets/action publishes
# straight to npm whenever there are no pending changesets — which is easy to fire
# unintentionally on an ordinary merge. Releases here are an explicit decision:
# run this workflow from the Actions tab when you actually want to ship.
#
# Requires an NPM_TOKEN secret. The npm account has 2FA enabled, so it must be a
# granular access token with "Bypass two-factor authentication" enabled;
# a normal token fails with EOTP.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Create Release PR or Publish via Changesets
    runs-on: ubuntu-latest

    permissions:
      contents: write # create tags and GitHub releases
      pull-requests: write # open the release PR
      id-token: write # required for npm trusted publishing (OIDC) and provenance

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node >= 22.14.0 and npm >= 11.5.1.
          # Node 20 bundles npm 10.x, where OIDC does not exist — which is why
          # publishing failed with E404 on every PUT.
          node-version: 24.x
          registry-url: "https://registry.npmjs.org/"

      - name: Ensure npm supports trusted publishing
        # Node 24.x bundles npm 11.17+, which already satisfies the >= 11.5.1 that
        # OIDC requires — so no global npm install is needed.
        #
        # Deliberately NOT running `npm install -g npm@latest`: that pulls npm 12,
        # which changed `npm pack --json` from an array to an object keyed by
        # package name and broke pack:check. Use what Node ships, and fail loudly
        # here if a future Node image regresses below the OIDC minimum.
        run: |
          echo "node $(node -v) / npm $(npm -v)"
          node -e "
            const version = require('node:child_process').execSync('npm -v').toString().trim();
            const [major, minor, patch] = version.split('.').map(Number);
            const supported =
              major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!supported) {
              console.error('npm ' + version + ' is too old for OIDC trusted publishing (need >= 11.5.1)');
              process.exit(1);
            }
            console.log('npm ' + version + ' supports OIDC trusted publishing');
          "

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo Packages
        run: pnpm run build

      - name: Verify Package Tarballs
        run: pnpm run pack:check

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: release"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN on purpose. This repository publishes via npm trusted
          # publishing (OIDC), configured per package on npmjs.com against
          # Lelianto/create-opencraft-app + publish.yml. The short-lived credential
          # is minted from the `id-token: write` permission above.
          #
          # Do NOT set NODE_AUTH_TOKEN here: the .npmrc that actions/setup-node
          # writes interpolates it, and an empty value produces an unauthenticated
          # request that the registry answers with a misleading 404.
          #
          # Every package needs its own trusted publisher entry — npm allows one
          # per package, and there is no scope-wide setting.