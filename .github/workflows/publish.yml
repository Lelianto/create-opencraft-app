name: Publish to NPM

# Manual only, on purpose.
#
# A `push: branches: [main]` trigger combined with changesets/action publishes
# straight to npm whenever there are no pending changesets — which is easy to fire
# unintentionally on an ordinary merge. Releases here are an explicit decision:
# run this workflow from the Actions tab when you actually want to ship.
#
# Authentication is npm trusted publishing (OIDC) — no NPM_TOKEN. Every package
# needs its own trusted publisher entry on npmjs.com pointing at this repository
# and this workflow filename; npm allows one per package and has no scope-wide
# setting.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Declared at workflow level, matching the known-good setup in the sibling
# file-validator repository.
permissions:
  contents: write # create tags and GitHub releases
  pull-requests: write # open the release PR
  id-token: write # mint the OIDC token for trusted publishing and provenance

jobs:
  publish:
    name: Create Release PR or Publish via Changesets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node >= 22.14.0 and npm >= 11.5.1.
          # Node 20 bundles npm 10.x, where OIDC does not exist — which is why
          # publishing failed with E404 on every PUT.
          #
          # `registry-url` is deliberately NOT set. It makes setup-node write an
          # .npmrc containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`,
          # and with no token in the environment that resolves to an empty
          # credential. npm then presents an empty token instead of falling back to
          # OIDC, and the registry answers 404. The default registry is npmjs.org
          # anyway, so nothing is lost.
          node-version: 24.x

      - name: Diagnose publish authentication
        # Cheap, and it turns "E404" into an answerable question. Prints no secrets:
        # only whether the OIDC request variables exist and what npm has configured.
        run: |
          echo "node $(node -v) / npm $(npm -v)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC: request URL present (id-token: write is in effect)"
          else
            echo "OIDC: NOT AVAILABLE - id-token: write is missing or ineffective"
          fi
          echo "--- npmrc files that could override OIDC ---"
          for f in "$RUNNER_TEMP/.npmrc" "$HOME/.npmrc" "$GITHUB_WORKSPACE/.npmrc"; do
            if [ -f "$f" ]; then
              echo "found $f:"
              sed -E 's/(_authToken=).*/\1<redacted>/' "$f" | sed 's/^/    /'
            else
              echo "absent  $f"
            fi
          done
          echo "--- effective registry ---"
          npm config get registry

      - name: Ensure npm supports trusted publishing
        # Node 24.x bundles npm 11.17+, which already satisfies the >= 11.5.1 that
        # OIDC requires — so no global npm install is needed.
        #
        # Deliberately NOT running `npm install -g npm@latest`: that pulls npm 12,
        # which changed `npm pack --json` from an array to an object keyed by
        # package name and broke pack:check. Use what Node ships, and fail loudly
        # here if a future Node image regresses below the OIDC minimum.
        run: |
          echo "node $(node -v) / npm $(npm -v)"
          node -e "
            const version = require('node:child_process').execSync('npm -v').toString().trim();
            const [major, minor, patch] = version.split('.').map(Number);
            const supported =
              major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!supported) {
              console.error('npm ' + version + ' is too old for OIDC trusted publishing (need >= 11.5.1)');
              process.exit(1);
            }
            console.log('npm ' + version + ' supports OIDC trusted publishing');
          "

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo Packages
        run: pnpm run build

      - name: Verify Package Tarballs
        run: pnpm run pack:check

      - name: Diagnose OIDC exchange (dry-run, publishes nothing)
        # npm swallows the registry's real rejection reason and only surfaces
        # ENEEDAUTH. `npm publish --dry-run` still performs the OIDC token
        # exchange, so the verbose line "Failed token exchange request with body
        # message: <reason>" names the exact mismatch (workflow filename,
        # environment, allowed actions). Run it once to see the true reason.
        working-directory: packages/config
        run: npm publish --dry-run --access public --loglevel verbose 2>&1 | grep -iE "oidc|token exchange|ENEEDAUTH|need auth|body message" || true

      - name: Inspect OIDC claims
        # Decode the GitHub OIDC token npm will present to the registry, so we can
        # compare repository / workflow / event_name against npm's trusted
        # publisher config without guessing.
        run: |
          curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d).value.split('.')[1];const c=JSON.parse(Buffer.from(j,'base64'));console.log(JSON.stringify({repository:c.repository,repository_owner:c.repository_owner,workflow:c.workflow,ref:c.ref,event_name:c.event_name,repository_visibility:c.repository_visibility,environment:c.environment},null,2))})"

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: release"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN on purpose. This repository publishes via npm trusted
          # publishing (OIDC), configured per package on npmjs.com against
          # Lelianto/create-opencraft-app + publish.yml. The short-lived credential
          # is minted from the `id-token: write` permission above.
          #
          # Do NOT set NODE_AUTH_TOKEN here: the .npmrc that actions/setup-node
          # writes interpolates it, and an empty value produces an unauthenticated
          # request that the registry answers with a misleading 404.
          #
          # Every package needs its own trusted publisher entry — npm allows one
          # per package, and there is no scope-wide setting. Confirmed empirically:
          # a plain `npm publish` of @antihero/config, with OIDC available and no
          # .npmrc present, still returned ENEEDAUTH because that package had no
          # trusted publisher configured.
          #
          # Matches the working configuration in the sibling file-validator repo.
          NPM_CONFIG_PROVENANCE: true
