name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Registry Manifests
        run: pnpm run registry:validate

      - name: Run Monorepo Lint, Type-Check & Tests
        run: pnpm run verify

      - name: Build Monorepo Packages
        run: pnpm run build

      - name: Verify Package Tarballs
        run: pnpm run pack:check

  generated-apps:
    name: Generated app (${{ matrix.label }}) type-check & build
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: supabase
            architecture: hybrid
            backend: supabase
            auth: google
            storage: vercel-blob
            modules: image-upload,dashboard,crud-example,confirmation-dialog
          - label: firebase
            architecture: hybrid
            backend: firebase
            auth: google
            storage: firebase
            modules: image-upload,dashboard

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI Packages
        run: pnpm run build

      - name: Generate sample app
        run: node "$GITHUB_WORKSPACE/packages/create-opencraft-app/dist/src/bin.js" sample-${{ matrix.label }} --architecture ${{ matrix.architecture }} --backend ${{ matrix.backend }} --auth ${{ matrix.auth }} --storage ${{ matrix.storage }} --modules ${{ matrix.modules }} --package-manager pnpm --yes --no-install --no-git

      - name: Install generated app dependencies
        working-directory: ./sample-${{ matrix.label }}
        run: pnpm install

      - name: Type-check generated app
        working-directory: ./sample-${{ matrix.label }}
        run: pnpm run type-check

      - name: Build generated app
        working-directory: ./sample-${{ matrix.label }}
        run: pnpm run build