name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Registry Manifests
        run: pnpm run registry:validate

      - name: Run Monorepo Lint, Type-Check & Tests
        run: pnpm run verify

      - name: Build Monorepo Packages
        run: pnpm run build

      - name: Verify Package Tarballs
        run: pnpm run pack:check

  generated-apps:
    name: Generated app (${{ matrix.label }}) type-check & build
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: supabase
            architecture: hybrid
            backend: supabase
            auth: google
            storage: vercel-blob
            modules: image-upload,dashboard,crud-example,confirmation-dialog
          - label: firebase
            architecture: hybrid
            backend: firebase
            auth: google
            storage: firebase
            modules: image-upload,dashboard
          - label: atomic
            architecture: atomic
            backend: none
            auth: none
            storage: none
            modules: dashboard,data-table
          - label: feature-firebase
            architecture: feature
            backend: firebase
            auth: google
            storage: firebase
            modules: crud-example,image-upload
          - label: supabase-storage
            architecture: hybrid
            backend: supabase
            auth: google
            storage: supabase
            modules: file-upload,user-profile
          - label: preset-saas
            preset: saas
          - label: preset-self-hosted
            preset: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI Packages
        run: pnpm run build

      # The sample app is generated OUTSIDE the repository, in the runner's temp
      # directory.
      #
      # Generating it inside $GITHUB_WORKSPACE silently breaks the install: the repo
      # root has a pnpm-workspace.yaml, so `pnpm install` in a subdirectory walks up,
      # finds the workspace root, sees the sample is not covered by the workspace
      # globs, and installs nothing locally. The app then has no node_modules and
      # type-check fails with "cannot find module" for every dependency, including
      # react. Keeping it outside the workspace also matches how a real user
      # scaffolds a project.
      - name: Generate sample app
        # Run from the temp directory and pass a bare name, so the project name
        # stays a valid npm package name rather than an absolute path.
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          if [[ -n "${{ matrix.preset }}" ]]; then
            node "$GITHUB_WORKSPACE/packages/create-opencraft-app/dist/src/bin.js" \
              "sample-${{ matrix.label }}" \
              --preset ${{ matrix.preset }} \
              --package-manager pnpm --yes --no-install --no-git
          else
            node "$GITHUB_WORKSPACE/packages/create-opencraft-app/dist/src/bin.js" \
              "sample-${{ matrix.label }}" \
              --architecture ${{ matrix.architecture }} \
              --backend ${{ matrix.backend }} \
              --auth ${{ matrix.auth }} \
              --storage ${{ matrix.storage }} \
              --modules ${{ matrix.modules }} \
              --package-manager pnpm --yes --no-install --no-git
          fi

      - name: Install generated app dependencies
        working-directory: ${{ runner.temp }}/sample-${{ matrix.label }}
        run: pnpm install --ignore-workspace

      - name: Verify dependencies actually installed
        working-directory: ${{ runner.temp }}/sample-${{ matrix.label }}
        # Fail loudly here rather than surfacing as hundreds of confusing
        # "cannot find module" type errors in the next step.
        run: test -d node_modules/next || { echo "::error::pnpm install did not populate node_modules"; exit 1; }

      - name: Type-check generated app
        working-directory: ${{ runner.temp }}/sample-${{ matrix.label }}
        run: pnpm run type-check

      - name: Build generated app
        working-directory: ${{ runner.temp }}/sample-${{ matrix.label }}
        run: pnpm run build